version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentra-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: agentra_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentra-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/agentra_dev
      SESSION_SECRET: generate-a-secure-random-secret-key-32-chars-minimum
      SESSION_TTL_HOURS: 72
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: lax
      AI_PROVIDER: mock
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "5000:5000"

volumes:
  pgdata:
